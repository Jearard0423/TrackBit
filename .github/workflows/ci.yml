name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Check PHP syntax
        run: |
          php -l router.php
          php -l api/insights.php

      - name: Validate Firebase rules JSON
        run: php -r 'json_decode(file_get_contents("database.rules.json"), true, 512, JSON_THROW_ON_ERROR);'
